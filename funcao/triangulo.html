<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Função área do triângulo</title>
  </head>

  <body>
    <h1>Função área do triângulo</h1>

    <label
      >Base
      <input type="number" id="base" />
    </label>

    <label
      >Altura
      <input type="number" id="altura" />
    </label>

    <button onclick="mostrarArea()">Calcular a área</button>

    <br />

    <output id="output"></output>

    <script>
      // Captura o campo onde o usuário informa a base.
      const base = document.getElementById("base");

      // Captura o campo onde o usuário informa a altura.
      const altura = document.getElementById("altura");

      // Captura o elemento onde o resultado será exibido.
      const output = document.getElementById("output");

      // Função responsável por calcular e mostrar a área.
      function mostrarArea() {
        // Pega o valor da base e transforma em número.
        let baseValue = Number(base.value);

        // Pega o valor da altura e transforma em número.
        let alturaValue = Number(altura.value);

        // Calcula a área usando a fórmula do triângulo.
        let area = (baseValue * alturaValue) / 2;

        // Exibe o resultado na página.
        output.innerHTML = `A área do triângulo de base ${baseValue} e a altura ${alturaValue}: é ${area}`;
      }
    </script>
  </body>
</html>
