<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Switch</title>
  </head>

  <body>
    <h1>Switch</h1>

    <script>
      /* =================================================================== 
        pedir para o usuário digitar um número de 0 à 6 
        Se o número for 0, mostrar "Domingo" 
        Se o número for 1, mostrar "Segunda-feira"
        Se o número for 2, mostrar "Terça-feira" 
        Se o número for 3, mostrar "Quarta-feira" 
        Se o número for 4, mostrar "Quinta-feira" 
        Se o número for 5, mostrar "Sexta-feira" 
        Se o número for 6, mostrar "Sábado" 

        Se for diferente de 0,1,2,3,4,5 ou 6, mostrar a mensagem "dígite um 
        número entre 0 e 6" 

        aqui como eu estou verificando igualdade, basta eu comparar a string, 
        por isso não precisei converter para número, não precisei usar parseFloat

        Essa estrutura de switch é muito interessante, pois vou verificando caso 
        a caso, e para não mostrar o próximo caso é só eu usar a palavra break

        E para eu mostrar uma mensagem caso a pessoa não dígite entre 0 e 6 
        (nesse caso específico) é só eu colocar default: alert("dígite um número 
        entre 0 e 6");, isso funcionará perfeitamente

        SWITCH: SEMPRE VAI COMPARAR 1.IGUALDADE; 2. VALOR E TIPO; e nunca 
        se esqueça de colocar o BREAK; 
        =================================================================== */

      let n = prompt("digite um número de 0 à 6");

      switch (n) {
        case "0":
          alert("Domingo");
          break;
        case "1":
          alert("Segunda-feira");
          break;
        case "2":
          alert("Terça-feira");
          break;
        case "3":
          alert("Quarta-feira");
          break;
        case "4":
          alert("Quinta-feira");
          break;
        case "5":
          alert("Sexta-feira");
          break;
        case "6":
          alert("Sábado");
          break;
        default:
          alert("dígite um número entre 0 e 6");
          break;
      }

      let x = 10;
      switch (x) {
        case "10":
          alert("x é string");
          break;
        case 10:
          alert("x é número");
          break; // esse break não é necessário, pois esse é o último case
      }
    </script>
  </body>
</html>
