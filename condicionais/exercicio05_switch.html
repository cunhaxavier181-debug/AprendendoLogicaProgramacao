<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Switch</title>
  </head>

  <body>
    <h1>Switch</h1>

    <script>
      /*
        switch compara o valor e o tipo usando igualdade estrita (===).

        prompt() sempre retorna uma string, por isso os cases também usam strings.
        Assim, não é necessário converter o valor com parseFloat().

        break encerra o switch após encontrar o case correspondente.
        default é executado quando nenhum case é encontrado.
      */

      let n = prompt("digite um número de 0 à 6");

      switch (n) {
        case "0":
          alert("Domingo");
          break;
        case "1":
          alert("Segunda-feira");
          break;
        case "2":
          alert("Terça-feira");
          break;
        case "3":
          alert("Quarta-feira");
          break;
        case "4":
          alert("Quinta-feira");
          break;
        case "5":
          alert("Sexta-feira");
          break;
        case "6":
          alert("Sábado");
          break;
        default:
          alert("dígite um número entre 0 e 6");
          break;
      }

      let x = 10;

      switch (x) {
        case "10":
          alert("x é string");
          break;
        case 10:
          alert("x é número");
          break; // opcional no último case
      }
    </script>
  </body>
</html>
