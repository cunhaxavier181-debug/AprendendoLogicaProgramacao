    <h1>Desafio 02</h1>

    <script>
      // se eu mudar de true para false, minha condição muda automaticamente

      //  if (media > 4 && n1 > 0 && n2 > 0) aqui se qualquer coisa for diferente disso, ele será REPROVADO, é isso

      // vou colocar um outro if para impedir que o usuário digite um numero maior que 10, caso ele digite números entre 0 e 10, ele vai para o if de APROVADO OU REPROVADO

      // aqui tem duas formas de fazer o desafio, usando os operadores lógicos, a primeira está comentada e a segunda está válida, porém posso inverter e terei o mesmo resultado

      // eu acrescentei mais uma condição no meu if abaixo, ficou um tanto complexo if (n1 <= 10 && n2 <= 10 && n1 >= 0 && n2 >= 0), porém irei aprender a diminuir toda essa linha de código mais à frente no curso

      // Observação: tanto no meu primeiro if quanto no meu segundo que está comentado, o código funcionou normalmente, a diferença está basicamente nos conectivos lógicos && (E) e no || (OU), isso faz com que eu altere um pouco a sintaxe, mas é bem pouca

      let n1 = parseFloat(prompt("dígite a nota 1"));
      let n2 = parseFloat(prompt("dígite a nota 2"));

      if (n1 > 10 || n2 > 10 || n1 < 0 || n2 < 0) {
        alert("Dígite apenas números entre 0 e 10");
      } else {
        let media = (n1 + n2) / 2;

        if (media > 4 && n1 > 0 && n2 > 0) {
          alert("APROVADO");
        } else {
          alert("REPROVADO");
        }
      }
