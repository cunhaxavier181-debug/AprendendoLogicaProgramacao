<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercicio 04</title>
  </head>

  <body>
    <h1>Exercicio 04</h1>

    <script>
      // Primeiro, verificamos se algum dos valores digitados não é um número.
      // O operador || significa "OU": basta uma das condições ser verdadeira
      // para que o bloco seja executado.
      //
      // Se essa condição for verdadeira, o primeiro if será executado.
      // Depois disso, o programa continuará normalmente até o final.
      //
      // Caso a condição seja falsa, o JavaScript passa para o else if.
      // O else if verifica se alguma das notas está fora do intervalo permitido.
      //
      // Se o if e o else if forem falsos, significa que:
      // - as duas entradas são números;
      // - as duas notas estão entre 0 e 10.
      //
      // Nesse caso, o programa executa o bloco do else e calcula a média.
      //
      // Depois de verificar as notas, o programa chega ao alert("fim do programa"),
      // que será executado independentemente de qual bloco anterior foi executado.

      let n1 = parseFloat(prompt("dígite a nota 1"));
      let n2 = parseFloat(prompt("dígite a nota 2"));

      // Verifica se alguma das notas não é um número.
      if (isNaN(n1) || isNaN(n2)) {
        alert("dígite apenas números");

        // Verifica se alguma nota está fora do intervalo de 0 a 10.
      } else if (n1 < 0 || n2 < 0 || n1 > 10 || n2 > 10) {
        alert("Dígite apenas números 0 e 10");

        // Se nenhuma das condições anteriores for verdadeira,
        // as notas são válidas e podemos calcular a média.
      } else {
        let media = (n1 + n2) / 2;

        // Todas as condições precisam ser verdadeiras para a aprovação:
        // a média deve ser maior que 4 e as duas notas devem ser maiores que 0.
        if (media > 4 && n1 > 0 && n2 > 0) {
          // Bloco executado quando a condição é verdadeira.
          alert("APROVADO");
        } else {
          // Bloco executado quando a condição é falsa.
          alert("REPROVADO");
        }
      }

      // Este comando está fora dos blocos condicionais.
      // Por isso, será executado sempre, independentemente do resultado
      // das condições anteriores.
      alert("fim do programa");
    </script>
  </body>
</html>
