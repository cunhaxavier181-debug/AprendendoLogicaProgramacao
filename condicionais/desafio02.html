  <body>
    <h1>Desafio 02</h1>

    <script>
      /* ====================================================================== 
        se eu mudar de true para false, minha condição muda automaticamente 

        if (media > 4 && n1 > 0 && n2 > 0) aqui se qualquer coisa for diferente 
        disso, ele será REPROVADO, é isso 

        vou colocar um outro if para impedir que o usuário digite um numero maior 
        que 10, caso ele digite números entre 0 e 10, ele vai para o if de 
        APROVADO OU REPROVADO 

        aqui tem duas formas de fazer o desafio, usando os operadores lógicos, 
        a primeira está comentada e a segunda está válida, porém posso inverter 
        e terei o mesmo resultado 
        ====================================================================== */

      let n1 = parseFloat(prompt("dígite a nota 1"));
      let n2 = parseFloat(prompt("dígite a nota 2"));

      // if (n1 > 10 || n2 > 10) {
      //   alert("Dígite apenas números menores ou iguais à 10");
      // } else {
      //   let media = (n1 + n2) / 2;

      //   if (media > 4 && n1 > 0 && n2 > 0) {
      //     alert("APROVADO");
      //   } else {
      //     alert("REPROVADO");
      //   }
      // }

      if (n1 <= 10 && n2 <= 10) {
        let media = (n1 + n2) / 2;

        if (media > 4 && n1 > 0 && n2 > 0) {
          alert("APROVADO");
        } else {
          alert("REPROVADO");
        }
      } else {
        alert("Dígite apenas números menores ou iguais à 10");
      }
    </script>
