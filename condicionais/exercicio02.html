<!doctype html>

  <body>
    <h1>Exercício 02</h1>

    <script>
      /* =================================================================== 
        Pedir para o usuário digitar dois números 
        calcular a média 
        mostrar a mensagem "APROVADO!" caso a média seja maior que 4 ou 
        "REPROVADO" caso seja menou ou igual à 4 
        if e else são usados na maioria das linguagens de programação para 
        apresentar alguma mensagem, como eu estou pedindo, tudo que estiver 
        dentro das chaves será mostrado pelo alert, e no final coloquei outro 
        alert só para mostrar fim do programa
        =================================================================== */

      let n1 = parseFloat(prompt("dígite a nota 1"));
      let n2 = parseFloat(prompt("dígite a nota 2"));

      let media = (n1 + n2) / 2;

      if (media > 4) {
        alert("APROVADO!");
      } else {
        alert("REPROVADO!");
      }

      alert("FIM DO PROGRAMA!");
    </script>
  </body>
</html>
