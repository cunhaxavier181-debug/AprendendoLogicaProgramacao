<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desafio Switch</title>
  </head>

  <body>
    <h1>Desafio Switch</h1>

    <script>
      /* ====================================================================== 
        eu preciso estudar bastante, pois não consigo resolver um problema 
        simples como esse, prestar mais atenção, pois assim fica dificil evoluir 
        
        Se eu deixar a minha let myvar = null; e não colocar null entre aspas, 
        o meu alert não funcionará corretamente, pois irá ficar aparecendo null 
        o tempo inteiro, erro de implementação antiga, porém as atualizações não 
        podem modificar isso, pois em sistemas antigos o null é reconhecido como 
        objeto e funciona normalmente, então para o meu desafio coloquei ele entre 
        aspas, ai sim o meu switch funcionou.....LEMBRAR SEMPRE DA 
        RETROCOMPATIBILIDADE DO JAVASCRIPT, ELE TEM QUE FUNCIONAR MESMO PARA OS 
        SISTEMAS ARCAICOS 

        Se eu mudar a minha variável para número ou qualquer outra variável aceita 
        pelo javascript, a minha switch será reconhecida naturalmente
        ====================================================================== */

      let myvar = "null";

      switch (typeof myvar) {
        case "number":
          alert("myVar é número");
          break;
        case "string":
          alert("myVar é texto");
          break;
        case "boolean":
          alert("myVar é boleana");
          break;
        case "undefined":
          alert("myVar é undefined");
          break;
        default:
          alert("nenhum tipo conhecido");
      }
    </script>
  </body>
</html>
