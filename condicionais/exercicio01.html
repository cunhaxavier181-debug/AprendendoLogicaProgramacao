<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 01</title>
  </head>

  <body>
    <h1>Exercício 01</h1>

    <script>
      // Solicita ao usuário duas notas através do prompt.
      // O parseFloat() converte o valor digitado, que inicialmente é uma string,
      // para um número decimal.
      let n1 = parseFloat(prompt("dígite a nota 1"));
      let n2 = parseFloat(prompt("dígite a nota 2"));

      // Calcula a média somando as duas notas e dividindo o resultado por 2.
      let media = (n1 + n2) / 2;

      // O if verifica se uma determinada condição é verdadeira.
      // Se a média for maior que 4, a condição será true e o código
      // dentro das chaves será executado.
      //
      // Se a média for menor ou igual a 4, a condição será false
      // e o código dentro do if não será executado.
      if (media > 4) {
        alert("APROVADO!");
      }
    </script>
  </body>
</html>
