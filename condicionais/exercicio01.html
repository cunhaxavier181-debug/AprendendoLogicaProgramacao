<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 01</title>
  </head>

  <body>
    <h1>Exercício 01</h1>

    <script>
      /* =================================================================== 
        Pedir para o usuário digitar dois números
        calcular a média 
        mostrar a mensagem "APROVADO!" caso a média seja maior que 4 
        if é usado na maioria das linguagens de programação para apresentar 
        alguma mensagem, como eu estou pedindo, tudo que estiver dentro das 
        chaves será mostrado pelo alert 
        =================================================================== */

      let n1 = parseFloat(prompt("dígite a nota 1"));
      let n2 = parseFloat(prompt("dígite a nota 2"));

      let media = (n1 + n2) / 2;

      if (media > 4) {
        alert("APROVADO!");
      }
    </script>
  </body>
</html>
