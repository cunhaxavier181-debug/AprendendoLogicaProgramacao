<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notas</title>
  </head>

  <body>
    <h1>Notas Bimestrais dos alunos</h1>

    <ul id="listaAlunos">
      <li>
        Marcos
        <ul>
          <li>1</li>
          <li>3</li>
          <li>3</li>
          <li>8</li>
        </ul>
      </li>

      <li>
        Janaina
        <ul>
          <li>10</li>
          <li>7</li>
          <li>8</li>
          <li>9</li>
        </ul>
      </li>
    </ul>

    <script>
      const alunos = [
        {
          nome: "Marcos",
          notas: [1, 3, 3, 8],
        },
        {
          nome: "Janaina",
          notas: [10, 7, 9, 8],
        },
        {
          nome: "João",
          notas: [10, 6, 3, 0],
        },
      ];

      const listaAlunos = document.getElementById("listaAlunos");

      listaAlunos.innerHTML = "<li> Marcos";
      listaAlunos.innerHTML += "<ul>";
      listaAlunos.innerHTML += "<li>10</li> ";
      listaAlunos.innerHTML += "</ul> ";
      listaAlunos.innerHTML += "</li> ";
    </script>
  </body>
</html>
