<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 2</title>
  </head>

  <body>
    <h1>Exercício 2</h1>

    <script>
      // Pede para o usuário digitar um número e converte o valor para número decimal.
      let n1 = parseFloat(prompt("Dígite um número de 0 à 10"));

      // Pede para o usuário digitar outro número e converte o valor para número decimal.
      let n2 = parseFloat(prompt("Dígite outro número de 0 à 10"));

      // Soma os dois números e divide o resultado por 2 para calcular a média.
      let media = (n1 + n2) / 2;

      // Verifica se a média é maior que 7.
      // O resultado da comparação será true ou false.
      alert("A média é maior que 7? " + (media > 7));
    </script>
  </body>
</html>
