<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 1</title>
  </head>

  <body>
    <h1>Exercício 1</h1>

    <script>
      // lembrar que: um sinal de igual nunca é comparação mas sim atribuição, precisa de dois sinais de igual == para que seja comparação

      // O Operador => não é operador de comparação, mas sim uma notação para arrow function em javascript, o certo é sempre o sinal de igual depois >=

      // em algumas linguagens o operador de diferença é <>, já aqui é !=, lembrar disso

      let n1 = parseFloat(prompt("Dígite um número de 0 à 10"));
      let n2 = parseFloat(prompt("Dígite outro número de 0 à 10"));

      alert("O segundo número é maior ou igual ao primeiro? " + (n2 >= n1));
    </script>
  </body>
</html>
