<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 1</title>
  </head>

  <body>
    <h1>Exercício 1</h1>

    <script>
      // Pede para o usuário digitar um número e converte o valor para número decimal.
      let n1 = parseFloat(prompt("Dígite um número de 0 à 10"));

      // Pede para o usuário digitar outro número e converte o valor para número decimal.
      let n2 = parseFloat(prompt("Dígite outro número de 0 à 10"));

      // Verifica se o segundo número é maior ou igual ao primeiro.
      // O operador >= significa "maior ou igual".
      // O resultado da comparação será true ou false.
      alert("O segundo número é maior ou igual ao primeiro? " + (n2 >= n1));
    </script>
  </body>
</html>
