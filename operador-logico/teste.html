<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>teste</title>
  </head>

  <body>
    <h1>PARA REFLETIR</h1>

    <script>
      // Cria a variável a e atribui o valor 10.
      let a = 10;

      // Cria a variável b e atribui o valor 5.
      let b = 5;

      // Cria a variável c e atribui o valor 0.
      let c = 0;

      // O JavaScript resolve primeiro a expressão com && (E).
      // Depois resolve a expressão com || (OU).
      // (b > a && c > b) resulta em false, porque b não é maior que a.
      // Como a > b resulta em true, o OU (||) terá pelo menos um true.
      // Por isso, o resultado final será true.
      alert((b > a && c > b) || a > b);

      // Os parênteses fazem a expressão com || (OU) ser resolvida primeiro.
      // c > b resulta em false e a > b resulta em true.
      // Portanto, (c > b || a > b) resulta em true.
      // Depois, b > a é false.
      // Como o && (E) precisa que os dois lados sejam true, o resultado será false.
      alert(b > a && (c > b || a > b));
    </script>
  </body>
</html>
