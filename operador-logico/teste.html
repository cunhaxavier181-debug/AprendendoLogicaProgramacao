  <body>
    <h1>PARA REFLETIR</h1>

    <script>
      // no meu primeiro alert está dando true porque primeiro estou resolvendo a expressão que contém o conectivo && (E) para depois resolver o conectivo || (OU), como tem pelo menos um verdadeiro, então o alert da true

      // no meu segundo alert está dando false porque primeiro estou resolvendo a expressão que contém o conectivo || (OU) para depois resolver o conectivo && (E), como tem pelo menos um falso, então o alert da false, pois no conectivo && (E) para ser true, tudo tem que ser verdade

      let a = 10;
      let b = 5;
      let c = 0;

      alert((b > a && c > b) || a > b);
      alert(b > a && (c > b || a > b));
    </script>
  </body>
