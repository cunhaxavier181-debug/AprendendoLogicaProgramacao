<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1>Operadores lógicos</h1>

    <script>
      // Cria a variável isValid e atribui o valor true.
      let isValid = true;

      // Exibe o valor atual da variável isValid.
      alert("O campo é válido " + isValid);

      // O operador ! inverte o valor de isValid.
      // Como isValid é true, !isValid será false.
      alert("O campo não é válido " + !isValid);
    </script>
  </body>
</html>
