<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desafio</title>
  </head>

  <body>
    <h1>Desafio</h1>

    <script>
      // Pede para o usuário digitar a primeira nota e converte o valor para número decimal.
      let n1 = parseFloat(prompt("dígite a nota 1"));

      // Pede para o usuário digitar a segunda nota e converte o valor para número decimal.
      let n2 = parseFloat(prompt("dígite a nota 2"));

      // Soma as duas notas e divide o resultado por 2 para calcular a média.
      let media = (n1 + n2) / 2;

      // Verifica se a média é menor ou igual a 4 OU se alguma das notas é igual a 0.
      // Basta uma das condições ser verdadeira para o resultado ser true.
      alert("Está reprovado? " + (media <= 4 || n1 == 0 || n2 == 0));
    </script>
  </body>
</html>
