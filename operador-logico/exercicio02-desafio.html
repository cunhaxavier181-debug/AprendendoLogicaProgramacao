<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desafio</title>
  </head>

  <body>
    <h1>Desafio</h1>

    <script>
      let n1 = parseFloat(prompt("dígite a nota 1"));
      let n2 = parseFloat(prompt("dígite a nota 2"));

      let media = (n1 + n2) / 2;

      // para que ele esteja reprovado a media tem que ser igual ou inferior a 4, então se minha média der maior que 4, o meu alert vai aparecer como false, pois não estarei reprovado

      alert("Está reprovado? " + (media <= 4 || n1 == 0 || n2 == 0));
    </script>
  </body>
</html>
