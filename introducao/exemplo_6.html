<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo 6</title>
  </head>

  <body>
    <h1>Boolean, Number e string - typeof</h1>

    <script>
      // É possível checar o tipo, no javascript usando o operador typeof, ele é um operador unário, não precisa dos dois lados para retornar o valor... o operador = é um operador binário, assim como o (+, -, *, /)

      // a ação (comando) console.log é usado para nós desenvolvedores visualizar se o nosso código está correto antes de ser renderizado no navegador, só serve durante o desenvolvimento

      // se eu quero que uma mensagem que está dentro do meu texto seja vista como string (texto também), tenho algumas formas: coloco aspas "" e dentro dela seleciono o texto e coloco aspas '' ou inverto

      let mensagem = "olá eu sou uma 'mensagem de texto'";
      console.log(mensagem);

      console.log(typeof 0);
      console.log(typeof "0");
      console.log(typeof String(0));

      let isValid = true;

      console.log(typeof isValid);

      console.log(Boolean("0")); // true
      console.log(Boolean(0)); // false
      console.log(Boolean(undefined)); // false
      console.log(Boolean(null)); // false
      console.log(Boolean("")); // false
      console.log(Boolean(NaN)); // false

      let naoDeclarado = null; // aqui estou colocando a minha intenção que não quero declarar valor algum, é diferente de quando eu esqueço e ai aparece undefined em vez de null
      console.log(naoDeclarado);
      naoDeclarado = 0;
      console.log(naoDeclarado);

      let n = parseFloat("a");
      console.log(n); // aqui ele é NaN (not a number)
      console.log(typeof n); // já aqui o meu "a" é visto como um número

      console.log("--------");
      console.log(typeof undefined);
      console.log(typeof null); // isso é um erro de implementação do javascript, as atualizaçoes não podem modificar isso para manter o principio da web, os sites devem ser retrocompativeis
      console.log(typeof 0);
      console.log(typeof "");
      console.log(typeof true);

      console.log(typeof (10).toString());
    </script>
  </body>
</html>
