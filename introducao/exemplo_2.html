<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo 2</title>
  </head>

  <body>
    <h1>Segundo exemplo</h1>

    <script>
      // Cria a variável numero1 e armazena o valor digitado pelo usuário.
      let numero1 = prompt("Digite um número");

      // Converte o valor de numero1 de texto para número decimal.
      numero1 = parseFloat(numero1);

      // Cria a variável numero2 e armazena o valor digitado pelo usuário.
      let numero2 = prompt("Digite outro número");

      // Converte o valor de numero2 de texto para número decimal.
      numero2 = parseFloat(numero2);

      // Soma os valores armazenados em numero1 e numero2.
      let soma = numero1 + numero2;

      // Exibe o resultado da soma na tela.
      alert("A soma é: " + soma);
    </script>
  </body>
</html>
