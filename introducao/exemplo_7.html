<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo 7</title>
  </head>
  <body>
    <h1>Exemplo 7</h1>

    <script>
      // Cria a variável str e armazena o texto "Ba".
      let str = "Ba";

      // Tenta converter o conteúdo de str para um número inteiro.
      // Como "Ba" não é um número, o resultado da conversão será NaN.
      // Depois, o valor de str é concatenado com NaN, formando "BaNaN".
      str += parseInt(str);

      // Concatena a letra "a" ao final do conteúdo atual de str.
      // O resultado passa a ser "BaNaNa".
      str += "a";

      // Converte todo o conteúdo de str para letras minúsculas.
      // O resultado exibido será "banana".
      alert(str.toLowerCase());
    </script>
  </body>
</html>
