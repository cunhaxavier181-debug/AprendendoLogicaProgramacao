<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Primeiro Desafio</title>
  </head>

  <body>
    <h1>Primeiro Desafio</h1>

    <script>
      // Cria a variável numero1 e armazena o valor digitado pelo usuário.
      let numero1 = prompt("Digite um número");

      // Converte o valor de numero1 de texto para número inteiro.
      numero1 = parseInt(numero1);

      // Cria a variável numero2 e armazena o valor digitado pelo usuário.
      let numero2 = prompt("Dígite outro número");

      // Converte o valor de numero2 de texto para número inteiro.
      numero2 = parseInt(numero2);

      // Divide numero1 por numero2 e concatena o resultado com o texto.
      alert("A divisão é: " + numero1 / numero2);

      // Multiplica numero1 por numero2 e concatena o resultado com o texto.
      alert("A multiplicação é: " + numero1 * numero2);

      // Subtrai numero2 de numero1 e concatena o resultado com o texto.
      alert("A subtração é: " + (numero1 - numero2));

      // Soma numero1 com numero2 e concatena o resultado com o texto.
      alert("A soma é: " + (numero1 + numero2));
    </script>
  </body>
</html>
