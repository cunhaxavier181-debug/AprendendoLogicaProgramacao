<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo 1</title>
  </head>

  <body>
    <h1>Primeiro exemplo</h1>

    <script>
      // Cria a variável nome e armazena nela o valor digitado pelo usuário.
      let nome = prompt("Qual o seu nome?");

      // Exibe uma mensagem de boas-vindas usando o valor armazenado em nome.
      alert("Olá " + nome + ", Seja bem-vindo");
    </script>
  </body>
</html>
