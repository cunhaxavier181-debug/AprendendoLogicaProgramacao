<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo 1</title>
  </head>

  <body>
    <h1>Primeiro exemplo</h1>

    <script>
      // a tag alert serve para me mostra uma janela no meu navegador, se eu quiser mostrar um texto, preciso colocar dentro dos () uma aspas simples ou aspas duplas, lembrando que isso é para javascript, já em outras linguagens tem que verificar

      // O que são variáveis?: uma variável é um endereço na memória que armazena um valor, é como uma caixa que eu dei o nome, precisa de algumas regras, na qual eu vou aprender mais a frente...lembrar que uma variável só cabe um objeto por vez

      // O que são constantes?: uma cosntante é como se fosse uma variável que, depois de guadarmos algo, nunca mais podemos alterar seu conteúdo

      // Lembrar que a tag let é a mesma coisa que var, ela serve para eu criar uma variável... outra coisa, se eu criar um let com letra minuscula não posso colocar depois letra maiscula quando eu for validar (digamos  assim) essa let

      // O sinal de igual = é um sinal de atribuição, costumo atribuir o que está   do lado da direita para o lado da esquerda, que costuma ser minha variável (caixa da memória)

      // O sinal de + é de concatenação

      let nome = prompt("Qual o seu nome?");
      alert("Olá " + nome + ", Seja bem-vindo");
    </script>
  </body>
</html>
