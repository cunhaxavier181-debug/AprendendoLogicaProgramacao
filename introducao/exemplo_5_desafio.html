<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desafio</title>
  </head>

  <body>
    <h1>Desafio 2</h1>

    <script>
      // Cria a variável n e atribui o valor 10.
      let n = 10;

      // Multiplica o valor de n por 5 e reatribui o resultado à própria variável.
      // É a mesma coisa que: n = n * 5;
      n *= 5;

      // Soma 1 ao valor de n e reatribui o novo valor.
      // É a mesma coisa que: n = n + 1;
      n++;

      // Calcula o resto da divisão de n por 6 usando o operador %.
      // Exibe o resultado junto com o texto na tela.
      alert("O resto da divisão de " + n + " por 6 é " + (n % 6));

      // Calcula o resto da divisão de n por 6 e eleva o resultado ao quadrado.
      // O operador ** é usado para realizar uma potenciação.
      alert(
        "O quadrado do resto da divisão de " + n + " por 6 é " + (n % 6) ** 2,
      );

      // Exibe o valor atual de n na tela.
      alert(n);

      // Divide o valor de n por 4 e reatribui o resultado à própria variável.
      // É a mesma coisa que: n = n / 4;
      n /= 4;

      // Exibe o novo valor de n na tela.
      alert(n);
    </script>
  </body>
</html>
