  <body>
    <h1>Mostrar a média</h1>

    <script>
      // pedir para o usuário digitar dois números

      // calcular a média

      // mostrar a média na tela

      // aqui abaixo estou usando duas abordagens diferentes para obter o mesmo resultado, na primeira abordagem fiz igual os outros exemplos anteriores, já na segunda abordagem é uma redução da primeira, porém funciona igual

      let n1 = prompt("digite um numero");
      n1 = parseFloat(n1);

      let n2 = parseFloat(prompt("digite outro número"));

      let media = (n1 + n2) / 2;

      alert("a média é: " + media);
    </script>
