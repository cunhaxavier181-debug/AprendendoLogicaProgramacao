<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desafio</title>
  </head>

  <body>
    <h1>Desafio</h1>

    <script>
      /* ====================================================================
        DESAFIO:
        Dado um array de números, mostre num alert a soma de todos eles
        ==================================================================== */
      /* ==================================================================== 
        primeira interação:
        i = 0   ; soma = 0  ; n = 2 ;
        segunda interação:
        i = 1   ; soma = 2  ; n = 6
        e assim por diante... 
        ==================================================================== */

      const numeros = [2, 5, 6, 3, 85, 98, 165];

      let soma = 0;

      for (let i = 0; i < numeros.length; i++) {
        let n = numeros[i];
        soma += n;
      }
      alert("A soma dos números é " + soma);
    </script>
  </body>
</html>
