<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desafio</title>
  </head>

  <body>
    <h1>Desafio</h1>

    <script>
      /* ====================================================================
         DESAFIO:
         Dado um array que pode conter valores de tipos diferentes, mostre num
         alert a soma de todos os números
         ==================================================================== */

      /* ====================================================================

         if (!isNaN(n)){
           console.log (n, typeof n)
           soma = soma + parseFloat(n)
           }

         lembrar que nesse caso o meu !isNaN não resolve o problema, tenho que
         de fato verificar se ele é um número ou não typeof... pois o boolean
         dá problema, ele não converte para número e nem o []
         ==================================================================== */

      /* ====================================================================
       1° EXEMPLO:

      const numeros = [
        true,
        5,
        6,
        undefined,
        78,
        null,
        Boolean,
        78,
        982,
        365,
        [],
        false,
      ];

      let soma = 0;

      for (let i = 0; i < numeros.length; i++) {
        let n = numeros[i];

        if (typeof n === "number") {
          // somando somente os números
          soma += n;
        }
      }
      alert("A soma dos números é " + soma);
      ==================================================================== */

      /* ==================================================================== 
       2° EXEMPLO:
       ==================================================================== */

      const numeros = [
        10,
        10,
        10,
        10,
        100,
        NaN,
        true,
        "String",
        "100",
        undefined,
        false,
        null,
      ];

      let soma = 0;

      for (let i = 0; i < numeros.length; i++) {
        if (!isNaN(numeros[i]) && typeof numeros[i] === "number") {
          soma += numeros[i];
        }
      }
      alert("A soma de todos os números do array resultou: " + soma);
    </script>
  </body>
</html>
