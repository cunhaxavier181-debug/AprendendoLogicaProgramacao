<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dia - semana</title>
  </head>

  <body>
    <h1>Dia - semana</h1>

    <script>
      // getDay() retorna um número correspondente ao dia da semana:
      // 0 = domingo | 1 = segunda-feira | 2 = terça-feira
      // 3 = quarta-feira | 4 = quinta-feira | 5 = sexta-feira
      // 6 = sábado

      // Array contendo os nomes dos dias da semana.
      const diasSemana = [
        "domingo",
        "segunda-feira",
        "terça-feira",
        "quarta-feira",
        "quinta-feira",
        "sexta-feira",
        "sábado",
      ];

      // Cria um objeto Date com a data e hora atuais.
      const hoje = new Date();

      // getDay() retorna o número correspondente ao dia atual.
      const diaSemanaHoje = hoje.getDay();

      // Exibe o nome do dia usando o número retornado pelo getDay().
      alert("Olá, hoje é " + diasSemana[diaSemanaHoje]);
    </script>
  </body>
</html>
