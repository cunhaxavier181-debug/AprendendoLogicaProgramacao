<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arrays</title>
  </head>

  <body>
    <h1>Arrays-1</h1>

    <script>
      let nomes = ["João", "Maria", "Daniel", "Ricardo", "Luciane"];

      // Solicita ao usuário um novo nome através de um prompt.
      let nomeDigitado = prompt("Dígite seu nome");

      // nomes.length retorna a quantidade atual de elementos do array.
      // Como os índices começam em 0, nomes.length representa a próxima posição vazia.
      // O nome digitado é armazenado nessa nova posição do array.
      nomes[nomes.length] = nomeDigitado;

      // Percorre todos os elementos do array e exibe cada nome na página.
      for (let i = 0; i < nomes.length; i++) {
        document.write("nome: " + nomes[i] + "<br>");
      }

      // Exibe a quantidade total de elementos existentes no array.
      document.write("A lista de nomes possui " + nomes.length + " elementos");
    </script>
  </body>
</html>
