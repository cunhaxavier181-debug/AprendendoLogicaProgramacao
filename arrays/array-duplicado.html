<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arrays</title>
  </head>

  <body>
    <h1>Arrays</h1>

    <script>
      /* ==================================================================== 
      arrays duplicados

      O que eu entendi: declaro uma array numeros, e coloco os números que eu quiser, 
      depois declaro inicialmente uma array numeros2 com indice vazio.. faço o loop 
      for e dentro dele declaro uma variável numero e essa variável receberá a minha 
      primeira array vezes 2 e no final eu uso o método push para "empurrar" um novo 
      valor no final do meu array numeros2
      ==================================================================== */

      let numeros = [4, 8, 1, 0, 4, 23, 98, 9, 100, 7];

      let numeros2 = [];

      for (let i = 0; i < numeros.length; i++) {
        let numero = numeros[i] * 2;

        // numeros2[numeros2.length] = numero;
        numeros2.push(numero); // método push() "empurra" um novo valor no final do array
      }
      console.log(numeros2);
    </script>
  </body>
</html>
