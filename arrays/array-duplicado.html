<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arrays</title>
  </head>

  <body>
    <h1>Arrays</h1>

    <script>
      // Array original contendo os números que serão utilizados no cálculo.
      let numeros = [4, 8, 1, 0, 4, 23, 98, 9, 100, 7];

      // Cria um novo array vazio para armazenar os resultados.
      let numeros2 = [];

      // Percorre todos os elementos do array "numeros".
      for (let i = 0; i < numeros.length; i++) {
        // Acessa o elemento atual do array e multiplica seu valor por 2.
        let numero = numeros[i] * 2;

        // Adiciona o resultado ao final do array "numeros2".
        numeros2.push(numero);
      }

      // Exibe no console o novo array com os valores multiplicados por 2.
      console.log(numeros2);
    </script>
  </body>
</html>
