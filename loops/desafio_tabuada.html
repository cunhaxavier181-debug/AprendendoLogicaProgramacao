<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desafio</title>
  </head>

  <body>
    <h1>Desafio Tabuada</h1>

    <script>
      let n = 1;

      let contador = 0;
      while (contador <= 10000) {
        document.write(n + " x " + contador + " : " + n * contador + "<br>");
        contador++;
      }
      document.write("fim do calculo");
    </script>
  </body>
</html>
