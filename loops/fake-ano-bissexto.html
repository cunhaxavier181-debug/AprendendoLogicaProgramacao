      // 2° Exemplo:

      // Cria uma variável para contar quantas vezes o loop será executado.
      let contador = 0;

      // Percorre os anos de 1004 até 2024, aumentando o ano de 4 em 4.
      for (let ano = 1004; ano <= 2024; ano += 4) {
        // Aumenta o contador em 1 a cada repetição do loop.
        contador++;

        // Exibe o ano atual na tela.
        document.write(ano + "<br>");
      }

      // Exibe no console quantas vezes o segundo loop foi executado.
      console.log(contador);
    </script>
