    <script>
      /* =================================================================== 
        mostre na tela todos os anos a partir de 1004 até o ano de 2024, 
        pulando de quatro em quatro anos.

        É como mostrar os anos bissextos, mas sem as regras pra descobrir se 
        um ano é bissexto ou não. (vamos imaginar que se o ano é multiplo de 
        quatro, ele é bissexto). 

        vou deixar esse for de exemplo : LEMBRAR QUE ELE TAMBÉM SERVE PARA O 
        QUE EU ESTOU FAZENDO, PORÉM TEM OUTRA MANEIRA, A QUAL DEMONSTRAREI MAIS 
        ABAIXO 

        nesse primeiro exemplo ele foi executado no meu console.log (1021) 
        vezes, porque por mais que ele mostre de 4 em 4 anos na tela, ele 
        conta de 1 em 1 no meu console.log

        no segundo exemplo ele foi executado no meu console.log (256) vezes, 
        já aqui não, ele realmente conta de 4 em 4 anos 
        =================================================================== */

      /*  1° exemplo:

          let contador = 0;

          for (let ano = 1004; ano <= 2024; ano++) {
            contador++;
            if (ano % 4 === 0) {
              document.write(ano + "<br>");
            }
          }
      */

      /* 2° exemplo */

      let contador = 0;

      for (let ano = 1004; ano <= 2024; ano += 4) {
        contador++;
        document.write(ano + "<br>");
      }

      console.log(contador);
