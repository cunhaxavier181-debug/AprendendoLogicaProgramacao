<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desafio</title>
  </head>

  <body>
    <h1>Desafio Tabuada</h1>

    <script>
      // Pede para o usuário digitar um número e converte o valor para número decimal.
      let n = parseFloat(prompt("dígite um número"));

      // Verifica se o valor digitado é realmente um número.
      if (!isNaN(n)) {
        // Cria um loop que começa em 0 e vai até 1000.
        for (let i = 0; i <= 1000; i++) {
          // Exibe a multiplicação de n por i na página.
          document.write(n + " x " + i + ": " + n * i + "<br>");

          // Verifica se i é múltiplo de 10 e se é maior que 0.
          if (i % 10 === 0 && i > 0) {
            // Exibe uma linha horizontal após cada dezena.
            document.write("<hr>");
          }
        }

        // Executado quando o valor digitado não é um número.
      } else {
        // Exibe uma mensagem informando que devem ser digitados apenas números.
        alert("dígite apenas números");
      }
    </script>
  </body>
</html>
