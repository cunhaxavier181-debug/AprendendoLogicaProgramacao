<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1>loop - dados</h1>

    <script>
      // Sorteia um número entre 1 e 6 para o primeiro dado.
      let dado1 = parseInt(Math.random() * 6 + 1);

      // Sorteia um número entre 1 e 6 para o segundo dado.
      let dado2 = parseInt(Math.random() * 6 + 1);

      // Sobrescreve o valor sorteado do primeiro dado e define o valor como 2.
      dado1 = 2;

      // Sobrescreve o valor sorteado do segundo dado e define o valor como 2.
      dado2 = 2;

      // Cria o contador e começa com o valor 1.
      let contador = 1;

      // Executa o loop enquanto os dois dados forem diferentes.
      while (dado1 !== dado2) {
        // Exibe os valores atuais dos dois dados no console.
        console.log(dado1, dado2);

        // Aumenta o contador em 1.
        contador++;

        // Sorteia novamente um número entre 1 e 6 para o primeiro dado.
        dado1 = parseInt(Math.random() * 6 + 1);

        // Sorteia novamente um número entre 1 e 6 para o segundo dado.
        dado2 = parseInt(Math.random() * 6 + 1);
      }

      // Exibe quantas vezes os dados foram jogados e qual número se repetiu.
      console.log(
        "Os dados foram jogados " +
          contador +
          " x vezes. E o número repetido foi o " +
          dado1,
      );

      // Exibe uma separação no console.
      console.log("-----------");

      // Sorteia novamente um número entre 1 e 6 para o primeiro dado.
      dado1 = parseInt(Math.random() * 6 + 1);

      // Sorteia novamente um número entre 1 e 6 para o segundo dado.
      dado2 = parseInt(Math.random() * 6 + 1);

      // Sobrescreve o valor sorteado do primeiro dado e define o valor como 2.
      dado1 = 2;

      // Sobrescreve o valor sorteado do segundo dado e define o valor como 2.
      dado2 = 2;

      // Reinicia o contador com o valor 1.
      contador = 1;

      // Executa o bloco pelo menos uma vez antes de verificar a condição.
      do {
        // Exibe os valores atuais dos dois dados no console.
        console.log(dado1, dado2);

        // Aumenta o contador em 1.
        contador++;

        // Sorteia novamente um número entre 1 e 6 para o primeiro dado.
        dado1 = parseInt(Math.random() * 6 + 1);

        // Sorteia novamente um número entre 1 e 6 para o segundo dado.
        dado2 = parseInt(Math.random() * 6 + 1);

        // Continua o loop enquanto os dois dados forem diferentes.
      } while (dado1 !== dado2);

      // Exibe quantas vezes os dados foram jogados e qual número se repetiu.
      console.log(
        "Os dados foram jogados " +
          contador +
          " x vezes. E o número repetido foi o " +
          dado1,
      );
    </script>
  </body>
</html>
