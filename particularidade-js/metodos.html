<!doctype html>
<html lang="pt-br">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Métodos</title>
   </head>

   <body>
      <h1>Métodos</h1>

      <script>
         // Cria um objeto que representa um produto.
         const produto = {
            // Propriedade que armazena o nome do produto.
            nome: "caneta",

            // Propriedade que informa a quantidade disponível em estoque.
            estoque: 10,

            // Método que simula a compra de uma quantidade de produtos.
            comprar: function (qtd) {
               // Verifica se a quantidade solicitada é maior que o estoque.
               if (qtd > this.estoque) {
                  // Informa que não há produtos suficientes.
                  console.log(
                     `quantidade em estoque insuficiente, quantidade em estoque é ${this.estoque}`,
                  );

                  // Encerra o método sem alterar o estoque.
                  return null;
               }

               // Informa que a compra pode ser realizada.
               console.log(`comprar caneta`);

               // Subtrai do estoque a quantidade comprada.
               // O this.estoque referencia a propriedade estoque deste objeto.
               this.estoque -= qtd;
            },

            // Declara um método usando a sintaxe abreviada.
            teste1() {
               // Exibe uma mensagem no console.
               console.log("teste 1");

               // Exibe o objeto que chamou o método.
               console.log(this);
            },

            // Cria uma arrow function como propriedade do objeto.
            teste2: () => {
               // Exibe uma mensagem no console.
               console.log("teste 2");

               // Em uma arrow function, this não é definido pelo objeto
               // que a chama. Ele é herdado do contexto externo.
               console.log(this); // Em um script clássico no navegador, geralmente window.
            },
         };

         // Exibe o objeto produto com suas propriedades e métodos.
         console.log(produto);

         // Comprar 3 canetas.

         // Esta linha criaria ou alteraria uma propriedade chamada quantidade.
         // Ela não alteraria a propriedade estoque.
         // produto.quantidade = 7;

         // Subtrai diretamente 3 unidades do estoque.
         produto.estoque -= 3;

         // Exibe o objeto após a alteração do estoque.
         console.log(produto);

         // Tenta simular a compra de 14 canetas por subtração direta.
         // Isso deixa o estoque negativo, pois não há validação nesta operação.
         produto.estoque -= 14;

         // Restaura manualmente o estoque para 10 unidades.
         produto.estoque = 10;

         // Compra 3 canetas usando o método comprar.
         produto.comprar(3);

         // Tenta comprar 13 canetas; como o estoque é insuficiente,
         // o método informa o problema e não altera o estoque.
         produto.comprar(13);

         // Exibe o objeto após as tentativas de compra.
         console.log(produto);

         // Executa teste1: o this normalmente referencia produto.
         produto.teste1();

         // Executa teste2: o this é herdado do contexto externo,
         // não do objeto produto.
         produto.teste2();
      </script>
   </body>
</html>
