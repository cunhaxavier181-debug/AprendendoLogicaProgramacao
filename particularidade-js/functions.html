<!doctype html>
<html lang="pt-br">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Functions</title>
   </head>

   <body>
      <h1>Functions</h1>

      <script>
         // functions declarations

         function ola1(nome) {
            console.log(`olá de function declaration ${nome}`);
         }

         // functions expressions

         const ola2 = function (nome) {
            console.log("olá de function expression, " + nome);
         };

         const arr = [
            ola1,
            ola2,
            function () {
               console.log("function anonima dentro de array executada");
            },
         ];
      </script>
   </body>
</html>
