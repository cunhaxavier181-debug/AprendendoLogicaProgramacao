<!doctype html>
<html lang="pt-br">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Tipos primitivos</title>
   </head>

   <body>
      <h1>truthy x falsy</h1>

      <p>
         Em Javascript, valores como 0, "", NaN, undefined, null e false são
         avaliados como false quando convertidos para boolean
      </p>

      <p>Todo o resto é avaliado como true</p>

      <script>
         // Declara a variável n sem atribuir nenhum valor a ela.
         let n;

         // Verifica se o valor de n é considerado verdadeiro (truthy).
         if (n) {
            // Executa este bloco se n for considerado verdadeiro.
            console.log("bloco verdade");
         } else {
            // Executa este bloco se n for considerado falso (falsy).
            console.log("bloco mentira");
         }
      </script>
   </body>
</html>
