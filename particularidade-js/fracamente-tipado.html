<!doctype html>
<html lang="pt-br">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Tipos primitivos</title>
   </head>

   <body>
      <h1>Fracamente típado</h1>

      <p>
         Em Javascript, variáveis podem armazenar valores de tipos diferentes
      </p>

      <script>
         // Declara a variável n com o valor numérico 10.
         let n = 10;

         // Substitui o valor anterior por um booleano.
         n = false;

         // Substitui o valor anterior por uma string.
         n = "string";

         // Substitui o valor anterior por um array com diferentes tipos de dados.
         n = [1, 2, false, "string", 3];

         // Exibe o valor atual de n no console.
         console.log(n);
      </script>
   </body>
</html>
